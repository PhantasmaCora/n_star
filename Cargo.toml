[package]
name = "n_star"
version = "0.1.0"
edition = "2024"
default-run = "n_star"

[dependencies]
bracket-lib = { version = "0.8.7"}
deterministic_default_hasher = "0.14.2"
figment = { version = "0.10.19", features = ["toml"] }
freetype-sys = { version = "0.23", features = ["bundled"] }
imageproc = "0.27.0"
ndarray = "0.17.2"
ndarray-conv = "0.6.1"
noise = "0.9.0"
rand = { version = "0.10.2", features = ["chacha"] }
serde = { version = "1.0.229", features = ["derive"] }
textwrap = "0.16.2"
typetag = "0.2.23"

[[bin]]
name="map_exporter"
path="src/map_exporter.rs"
